services:
  - type: web
    name: backend-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URLS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
    healthCheckPath: /health
