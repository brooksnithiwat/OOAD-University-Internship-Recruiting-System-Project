name: Backend CD

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      # 📥 Checkout repo
      - name: Checkout code
        uses: actions/checkout@v4

      # 📦 Install dependencies
      - name: Install dependencies
        run: npm ci

      # ✅ Run tests
      - name: Run tests
        run: npm test -- --passWithNoTests

      # 🚀 Trigger Render Deploy
      - name: Deploy to Render
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "⚠️  RENDER_DEPLOY_HOOK not set"
          else
            curl -X POST "$RENDER_DEPLOY_HOOK"
            echo "✅ Render deployment triggered"
          fi

      # ℹ️ Log deployment info
      - name: Log Supabase deployment info
        run: |
          echo "✅ Backend deployment workflow completed"
          echo "📋 Migrations and seeding will run in Render container using:"
          echo "   - DATABASE_URL (Supabase pooled connection)"
          echo "   - DIRECT_URL (Supabase direct connection)"
          echo "ℹ️  Ensure these environment variables are set in Render dashboard"