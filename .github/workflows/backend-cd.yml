name: Backend CD

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      # 🔍 DEBUG 1: show all env keys (ไม่โชว์ value)
      - name: Show ENV keys (safety debug)
        run: printenv | sort | grep -E "DATABASE|DIRECT|SUPABASE|PRISMA" || true

      # 🔍 DEBUG 2: check if secrets exist (length check)
      - name: Check env values length
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          echo "DATABASE_URL length:"
          echo -n "$DATABASE_URL" | wc -c

          echo "DIRECT_URL length:"
          echo -n "$DIRECT_URL" | wc -c

      # 🔍 DEBUG 3: show Prisma sees what
      - name: Show Prisma Env (filtered)
        run: |
          echo "===== DATABASE ====="
          printenv | grep DATABASE || true
          echo "===== DIRECT ====="
          printenv | grep DIRECT || true

      - name: Run Prisma Migrations
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: npx prisma migrate deploy

      - name: Run Database Seed
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
        run: npm run prisma:seed

      - name: Trigger Render Deploy
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: curl -X POST $RENDER_DEPLOY_HOOK