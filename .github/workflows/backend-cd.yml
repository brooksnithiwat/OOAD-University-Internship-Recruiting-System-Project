name: Backend CD

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      # 📥 Checkout repo
      - name: Checkout code
        uses: actions/checkout@v4

      # 📦 Install dependencies
      - name: Install dependencies
        run: npm ci

      # 🔧 Install Supabase CLI (official way)
      - name: Install Supabase CLI
        run: |
          curl -fsSL https://supabase.com/install.sh | sh

      # 🔧 Add CLI to PATH
      - name: Add Supabase to PATH
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      # 🔍 Verify CLI exists
      - name: Verify Supabase CLI
        run: supabase --version

      # 🔐 Run Supabase migrations (NO direct DB 5432)
      - name: Run Supabase Migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase link --project-ref hthrqcsxtoeagjylueqy
          supabase db push

      # 🌱 Prisma seed (runtime only)
      - name: Run Database Seed
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
        run: npm run prisma:seed

      # 🚀 Deploy to Render
      - name: Trigger Render Deploy
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: curl -X POST $RENDER_DEPLOY_HOOK