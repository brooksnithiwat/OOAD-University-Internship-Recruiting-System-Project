name: Backend CD

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      # 📦 install deps
      - name: Install dependencies
        run: npm ci

      # 🔧 install Supabase CLI (fix network issue with 5432)
      - name: Install Supabase CLI
        run: npm install -g supabase

      # 🔐 link project + run migrations (NO direct DB connection)
      - name: Run Supabase Migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase link --project-ref hthrqcsxtoeagjylueqy
          supabase db push

      # 🌱 Seed database (ใช้ Prisma runtime ได้)
      - name: Run Database Seed
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
        run: npm run prisma:seed

      # 🚀 Deploy to Render
      - name: Trigger Render Deploy
        run: curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK }}