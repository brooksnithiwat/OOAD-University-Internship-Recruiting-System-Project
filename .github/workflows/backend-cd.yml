name: Backend CD

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      # 📦 install dependencies
      - name: Install dependencies
        run: npm ci

      # 🔧 Install Supabase CLI (FIX: no npm -g)
      - name: Install Supabase CLI
        run: |
          curl -fsSL https://supabase.com/install.sh | sh
          echo "$HOME/.supabase/bin" >> $GITHUB_PATH

      # 🔐 Run Supabase migrations (NO direct DB 5432)
      - name: Run Supabase Migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase link --project-ref hthrqcsxtoeagjylueqy
          supabase db push

      # 🌱 Prisma seed (runtime only, safe)
      - name: Run Database Seed
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
        run: npm run prisma:seed

      # 🚀 Deploy to Render
      - name: Trigger Render Deploy
        run: curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK }}